name: références refaites (temporaire, branche claude/corrections)

# Temporaire : refait les références des règles et des tours que les données vérifiées des théâtres changent exprès
# (FACTIONS, MAISON_NOMS, rules_payload) et les dépose en artefact. Retiré au commit suivant.
on:
  push:
    branches: [claude/corrections]

permissions:
  contents: read

jobs:
  refaire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Règles et tours
        shell: bash
        run: |
          CONQUETE_REFAIRE_RULES=1 cargo test --locked -p conquete --test rules refaire -- --ignored --nocapture
          CONQUETE_REFAIRE_TOURS=1 cargo test --locked -p conquete --test tours refaire -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: references
          path: rust/conquete/tests/references/*.json
