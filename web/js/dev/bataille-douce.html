<style>
/* Maquette : une bataille de Conquête en rendu « doux », sur les vrais champs de bataille du jeu (bataille-hex-data.js, hexagones de 40 m).

   Plein écran, interface flottante. Un seul thème (verre sombre sur le champ de bataille), par choix. */
:root {

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--brume); color: var(--txt); font-family: var(--corps); -webkit-user-select: none; user-select: none; }

#zone { position: fixed; inset: 0; }

.vignette { position: absolute; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(ellipse 120% 95% at 50% 45%, transparent 58%, rgba(20, 30, 40, .45) 100%); }

.reg.choisi .l { border-color: var(--or); box-shadow: 0 0 0 2px var(--or); }
.reg svg { width: 14px; height: 14px; fill: #fff; flex: none; }
.reg .m { width: 46px; height: 4px; border-radius: 2px; background: rgba(0,0,0,.5); overflow: hidden; }
.reg .m i { display: block; height: 100%; background: var(--vert); }
.reg.fuit .l { background: #6b6b6b; }

</div>

// ============================================================ rendu
const toile = $('#scene');
const renderer = new THREE.WebGLRenderer({ canvas: toile, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;

const cam = new THREE.PerspectiveCamera(32, 1, 3, 5000);

// --- lots de triangles à couleurs par sommet (comme carte-douce.html)
const lot = () => ({ P: [], N: [], C: [] });
const VA = new THREE.Vector3(), VB = new THREE.Vector3(), VN = new THREE.Vector3(), HAUT = new THREE.Vector3(0, 1, 0);

// --- décor instancié

const enBas = geo => geo.translate(0, .5, 0);
const SORTES = {

for (const s of Object.values(SORTES)) s.d = [];
let FANE = 0;
const CC = new THREE.Color();
function teinte(col, f = FANE) { const c = new THREE.Color(col); if (f > 0) c.lerp(CC.set(0x6f9a52), f * .7); return c; }

  const ex = UNITES.filter(u => u.side !== ICI), ey = ex.reduce((a, u) => a + u.y, 0) / ex.length;
  const [x, z] = mVers(cx, cy + (ey - cy) * .3); cible3.set(x, 0, z); distc = 330;

}
