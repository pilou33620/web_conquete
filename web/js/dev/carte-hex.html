<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aquitaine en hexagones</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Maquette : la carte de campagne de Conquête refaite en plateau d'hexagones, style web_power (GridMaster).
   Même géographie et même échelle que le jeu (km), 1 hexagone = 4 km. Carte à gauche, panneau à droite ; en portrait, panneau dessous.
   Tokens repris de web_power/css/style.css : un seul thème sombre, par choix. */
:root {
  color-scheme: dark;
  --fond: #1b211a; --fond2: #253021; --fond3: #2a3327; --bord: #0f130e; --trait: #2b1d14; --sol: #141813;
  --txt: #f6f4ea; --doux: #b3bca5; --gris: #a9b39a; --or: #ffc94d; --vert: #7be08a; --rouge: #ff8a7a; --creme: #fff7e6;
  --titre: Fredoka, "Trebuchet MS", system-ui, sans-serif; --corps: Nunito, "Segoe UI", system-ui, sans-serif;
  --ombre: 0 4px 0 rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sol); color: var(--txt); font-family: var(--corps); }
button { font-family: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--vert); outline-offset: 2px; }
#app { display: grid; grid-template-rows: 60px minmax(0, 1fr); grid-template-columns: minmax(0, 1fr) 380px; height: 100%; }
.barre { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding-block: 0; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--fond); border-bottom: 3px solid var(--bord); min-width: 0; }
.titre-date { font-family: var(--titre); font-weight: 600; font-size: 19px; line-height: 1.15; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titre-date small { display: block; font: 800 11px var(--corps); color: var(--gris); }
.badge { flex: none; padding: 2px 8px; border-radius: 8px; background: var(--creme); color: var(--trait); font-weight: 800; font-size: 11px; border: 2px solid var(--bord); }
.camp { flex: none; display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 4px; border-radius: 12px; background: var(--fond2); border: 2px solid var(--bord); font-weight: 800; font-size: 13px; }
.camp i { width: 22px; height: 22px; border-radius: 50%; background: #c0392b; border: 2px solid var(--bord); }
.pills { display: flex; gap: 6px; margin-left: auto; min-width: 0; overflow: hidden; }
.pill { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 12px; background: var(--fond2); border: 2px solid var(--bord); font-weight: 800; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill .pt { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bord); background: var(--vert); }
.pill.alerte .pt { background: var(--or); }
.tresorerie { text-align: right; flex: none; }
.etiquette { font-size: 10px; font-weight: 800; letter-spacing: 2px; color: var(--gris); }
.argent { font-family: var(--titre); font-weight: 700; font-size: 21px; line-height: 1; color: var(--or); font-variant-numeric: tabular-nums; }

main { position: relative; overflow: hidden; background: #2d6aa0; min-width: 0; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#scene.glisse { cursor: grabbing; }
#etiquettes { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.ban { position: absolute; left: 0; top: 0; display: flex; align-items: center; white-space: nowrap; filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)); will-change: transform; }
.ban .pop { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--fond); border: 2.5px solid var(--bord); color: var(--c); font-family: var(--titre); font-weight: 700; font-size: 11px; z-index: 1; }
.ban .nom { margin-left: -8px; padding: 3px 12px 3px 14px; border-radius: 0 10px 10px 0; background: var(--c); color: var(--trait); border: 2.5px solid var(--bord); font-family: var(--titre); font-weight: 700; font-size: 15px; line-height: 1.1; }
.ban .nom small { display: block; font-family: var(--corps); font-weight: 800; font-size: 10.5px; }
.ban.ville .pop { width: 28px; height: 28px; font-size: 10px; } .ban.ville .nom { font-size: 13px; padding: 2px 10px 2px 12px; }
.ban.sombre .nom { color: var(--txt); }
.eti { position: absolute; left: 0; top: 0; padding: 1px 7px; border-radius: 9px; border: 2px solid var(--trait); background: var(--creme); font-family: var(--titre); font-size: 11.5px; font-weight: 600; color: var(--trait); white-space: nowrap; box-shadow: 0 2px 0 rgba(0,0,0,.3); will-change: transform; }
.flottant { position: absolute; z-index: 3; background: var(--fond); border: 2.5px solid var(--bord); border-radius: 16px; box-shadow: var(--ombre); }
.temps { left: max(12px, env(safe-area-inset-left, 0px)); top: 12px; display: flex; gap: 3px; padding: 4px; }
.temps button { min-width: 42px; min-height: 36px; padding: 0 10px; border: 0; border-radius: 11px; background: transparent; font: 800 13px var(--corps); cursor: pointer; }
.temps button.actif { background: var(--or); color: var(--trait); }
.lentilles { right: 12px; top: 12px; display: flex; flex-direction: column; gap: 4px; padding: 6px; }
.lentilles button { min-height: 30px; padding: 0 10px; border-radius: 10px; border: 2px solid var(--bord); background: var(--fond2); font-weight: 800; font-size: 12px; text-align: left; cursor: pointer; }
.lentilles button[aria-pressed="true"] { background: var(--or); color: var(--trait); }
.echelle { left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; padding: 6px 10px 7px; font-weight: 800; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.echelle .regle { height: 8px; margin-top: 4px; border: 2.5px solid var(--txt); border-top: 0; }
.bulle { position: fixed; z-index: 9; pointer-events: none; padding: 6px 10px; border-radius: 11px; background: var(--creme); color: var(--trait); border: 2px solid var(--bord); font-size: 12px; font-weight: 800; max-width: 260px; }
.bulle b { font-family: var(--titre); font-weight: 600; font-size: 14px; }

aside { display: flex; flex-direction: column; min-height: 0; background: var(--fond); border-left: 3px solid var(--bord); }
.onglets { display: flex; gap: 4px; padding: 8px 10px 6px; border-bottom: 2px solid var(--fond2); }
.onglets button { min-height: 32px; padding: 0 12px; border-radius: 10px; border: 2px solid var(--bord); background: var(--fond2); font-weight: 800; font-size: 12.5px; cursor: pointer; }
.onglets button[aria-selected="true"] { background: var(--or); color: var(--trait); }
#contenu { flex: 1; overflow-y: auto; padding: 6px 16px 24px; }
h2 { font-family: var(--titre); font-weight: 600; font-size: 24px; margin: 8px 0 2px; text-wrap: balance; }
h3 { font-family: var(--titre); font-weight: 600; font-size: 15px; margin: 18px 0 6px; color: var(--doux); }
.sous { color: var(--gris); font-weight: 700; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 4px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 9px; border: 2px solid var(--bord); background: var(--fond2); font-weight: 800; font-size: 12px; }
.chip i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bord); }
.lignes { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13.5px; }
.lignes dt { color: var(--gris); font-weight: 700; }
.lignes dd { margin: 0; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
.jauge { display: flex; gap: 3px; justify-content: flex-end; }
.jauge span { width: 16px; height: 10px; border-radius: 3px; border: 2px solid var(--bord); background: var(--fond3); }
.jauge span.on { background: var(--or); }
.routes { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.routes li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 10px; background: var(--fond2); border: 2px solid var(--bord); font-weight: 800; font-size: 13px; }
.routes li small { color: var(--gris); font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.routes li.royale { background: #3a3220; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 16px; }
.actions button { min-height: 40px; border-radius: 12px; border: 2.5px solid var(--bord); background: var(--fond2); font-weight: 800; font-size: 13px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
.actions button.prim { background: var(--or); color: var(--trait); }
.note { margin-top: 14px; color: var(--gris); font-size: 12px; font-weight: 700; line-height: 1.45; }
.fac { display: grid; grid-template-columns: 38px 1fr auto; gap: 4px 10px; align-items: center; padding: 10px; margin-top: 8px; border-radius: 14px; background: var(--fond2); border: 2.5px solid var(--bord); cursor: pointer; text-align: left; width: 100%; }
.fac.moi { border-color: var(--or); }
.fac .blason { grid-row: span 2; width: 38px; height: 44px; border: 2.5px solid var(--bord); border-radius: 4px 4px 19px 19px; background: var(--c); }
.fac b { font-family: var(--titre); font-weight: 600; font-size: 16px; }
.fac small { grid-column: 2 / 4; color: var(--doux); font-weight: 700; font-size: 12px; }
.fac .nb { font-weight: 800; font-size: 12px; color: var(--gris); text-align: right; font-variant-numeric: tabular-nums; }
.chargement { position: absolute; inset: 0; display: grid; place-items: center; z-index: 5; font-family: var(--titre); font-size: 18px; background: var(--fond); }

@media (max-width: 900px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 52px minmax(0, 1fr) minmax(0, 42%); }
  aside { border-left: 0; border-top: 3px solid var(--bord); }
  .pills, .camp span { display: none; }
  .titre-date { font-size: 15px; } .argent { font-size: 17px; }
  .lentilles { top: auto; bottom: 12px; flex-direction: row; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 24px); right: max(12px, env(safe-area-inset-right, 0px)); }
  .echelle { bottom: auto; top: 64px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header class="barre">
    <div class="titre-date">Janvier 1700<small>Le Grand Siècle finissant · tour 1</small></div>
    <span class="badge">MAQUETTE</span>
    <div class="camp" title="Votre camp"><i></i><span>Gironde · Le Négoce bordelais</span></div>
    <div class="pills" title="Valeurs d'exemple">
      <div class="pill"><span class="pt"></span>Vivres 3 420</div>
      <div class="pill"><span class="pt"></span>Fer 610</div>
      <div class="pill alerte"><span class="pt"></span>Bois 280</div>
      <div class="pill"><span class="pt"></span>Recrues 1 150</div>
    </div>
    <div class="tresorerie" title="Valeur d'exemple"><div class="etiquette">LIVRES</div><div class="argent">48 600</div></div>
  </header>
  <main id="zone">
    <canvas id="scene" aria-label="Carte de l'Aquitaine en hexagones"></canvas>
    <div id="etiquettes"></div>
    <div class="flottant temps" role="group" aria-label="Temps">
      <button type="button" class="actif">Ordres</button>
      <button type="button">Jouer le mois ▸</button>
    </div>
    <div class="flottant lentilles" role="group" aria-label="Calques">
      <button type="button" id="l-dep" aria-pressed="false">Départements</button>
      <button type="button" id="l-rou" aria-pressed="true">Routes</button>
      <button type="button" id="l-vil" aria-pressed="true">Villages</button>
    </div>
    <div class="flottant echelle" aria-live="off"><span id="ech-txt">20 km</span><div class="regle" id="ech-regle"></div></div>
    <div class="chargement" id="chargement">Le plateau se dresse…</div>
  </main>
  <aside>
    <div class="onglets" role="tablist">
      <button type="button" role="tab" id="o-lieu" aria-selected="true">Lieu</button>
      <button type="button" role="tab" id="o-roy" aria-selected="false">Les cinq pays</button>
    </div>
    <div id="contenu"></div>
  </aside>
</div>
<div class="bulle" id="bulle" hidden></div>

<script src="carte-hex-data.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
const $ = s => document.querySelector(s);
const nf = n => Math.round(n).toLocaleString('fr-FR');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ============================================================ données du jeu (game/geo.py, game/rules.py)
const D = CARTE_HEX, R = 10, SQ3 = Math.sqrt(3), RK = D.hexKm / SQ3, S = R / RK;   // S : unités 3D par km (le plateau garde l'échelle du jeu)
const OX = D.W * S / 2, OZ = D.H * S / 2;
const kmVers = (x, y) => [x * S - OX, y * S - OZ];
const GEO_T = ['ocean', 'eau', 'plaine', 'foret', 'lande', 'marais', 'colline', 'montagne', 'haute', 'dunes', 'vigne'];
// vitesse hors route, couvert, bonus de défense : game/geo.py TERRAIN
const REGLE = { ocean: [0, 0, 1], eau: [0, 0, 1], plaine: [.70, 0, 1], foret: [.42, 1, 1.10], lande: [.55, 1, 1], marais: [.30, 1, 1.05], colline: [.55, 0, 1.15], montagne: [.30, 1, 1.30], haute: [.12, 0, 1.45], dunes: [.35, 0, 1], vigne: [.60, 0, 1.05] };
const TERR = {
  mer: { nom: 'Océan', col: 0x1d5a86, h: -5.5, eau: 1 }, cote: { nom: 'Côte', col: 0xe6d49a, h: -2.4, eau: 1 }, eau: { nom: 'Étang, estuaire', col: 0xd2c88f, h: -2.4, eau: 1 },
  plaine: { nom: 'Plaine cultivée', col: 0xc9c65c, h: 0 }, prairie: { nom: 'Prairie', col: 0x84c450, h: 0 }, foret: { nom: 'Forêt', col: 0x5d9b3a, h: .2 },
  lande: { nom: 'Lande de pins', col: 0xaaa762, h: .1 }, marais: { nom: 'Marais', col: 0x6f9e6a, h: -.15 }, colline: { nom: 'Collines', col: 0xa2b65a, h: 2.6 },
  montagne: { nom: 'Montagne', col: 0x8f8879, h: 4.6 }, haute: { nom: 'Haute montagne', col: 0xa29b8e, h: 7.2 }, dunes: { nom: 'Dunes', col: 0xead9a2, h: .5 },
  vigne: { nom: 'Vignoble', col: 0xb4b660, h: .15 }, ville: { nom: 'Ville', col: 0xd3c7a6, h: .3 },
};
const FACTIONS = {
  '33': { nom: 'Gironde', titre: 'Le Négoce bordelais', cap: 'Bordeaux', col: '#c0392b' },
  '24': { nom: 'Dordogne', titre: 'Les Forges du Périgord', cap: 'Périgueux', col: '#2e8b3a' },
  '40': { nom: 'Landes', titre: 'Les Échassiers des Landes', cap: 'Mont-de-Marsan', col: '#e0a526' },
  '47': { nom: 'Lot-et-Garonne', titre: "Le Grenier de l'Aquitaine", cap: 'Agen', col: '#8e44ad' },
  '64': { nom: 'Basses-Pyrénées', titre: 'Les Montagnards basques et béarnais', cap: 'Pau', col: '#2b3fc4' },
};
const NOM_DEP = { '09': 'Ariège', '16': 'Charente', '17': 'Charente-Maritime', '19': 'Corrèze', '24': 'Dordogne', '31': 'Haute-Garonne', '32': 'Gers', '33': 'Gironde', '40': 'Landes', '46': 'Lot', '47': 'Lot-et-Garonne', '64': 'Basses-Pyrénées', '65': 'Hautes-Pyrénées', '82': 'Tarn-et-Garonne', '87': 'Haute-Vienne' };
const MOI = '33', NEUTRE = '#a9a394', PARCHEMIN = new THREE.Color(0xdcc79a);
const TYPE = { capitale: 'Chef-lieu', ville: 'Ville', village: 'Village', fort: 'Place forte' };

// ============================================================ hasard (repris de web_power)
function hache(x, y, s = 7) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function bruit(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), u = (x - xi) ** 2 * (3 - 2 * (x - xi)), v = (y - yi) ** 2 * (3 - 2 * (y - yi));
  const a = hache(xi, yi), b = hache(xi + 1, yi), c = hache(xi, yi + 1), d = hache(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
let g = 1;
function rnd() { g = (g + 0x6D2B79F5) | 0; let t = Math.imul(g ^ (g >>> 15), 1 | g); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const semer = t => { g = t.q * 7919 + t.r * 104729 + 13; };
const entre = (a, b) => a + rnd() * (b - a);

// ============================================================ grille (pointe en haut, axiale, comme web_power)
const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
const cle = (q, r) => q + ',' + r;
const T = new Map(), LISTE = [];
for (let row = 0; row < D.rows; row++) for (let col = 0; col < D.cols; col++) {
  const i = row * D.cols + col, r = row, q = col - (row - (row & 1)) / 2;
  const di = D.dep.charCodeAt(i) - 64, dep = di > 0 ? D.depts[di - 1] : '';
  let t = GEO_T[D.ter.charCodeAt(i) - 48];
  if (t === 'ocean') t = 'mer';
  if (t === 'plaine' && bruit(col * .35, row * .35) > .56) t = 'prairie';
  const tu = { q, r, col, row, k: cle(q, r), x: R * SQ3 * (q + r / 2) - OX, z: R * 1.5 * r - OZ, t, g: t, dep, jeu: !!FACTIONS[dep] };
  T.set(tu.k, tu); LISTE.push(tu);
}
const voisins = t => DIRS.map(([a, b]) => T.get(cle(t.q + a, t.r + b))).filter(Boolean);
const estEau = t => !!TERR[t.t].eau;
function versHex(x, z) {
  // inverse de tu.x/tu.z : en axial, x = R√3(q + r/2) − OX
  x += OX; z += OZ;
  const q = (SQ3 / 3 * x - z / 3) / R, r = (2 / 3 * z) / R, s = -q - r;
  let rq = Math.round(q), rr = Math.round(r); const rs = Math.round(s);
  const dq = Math.abs(rq - q), dr = Math.abs(rr - r), ds = Math.abs(rs - s);
  if (dq > dr && dq > ds) rq = -rr - rs; else if (dr > ds) rr = -rq - rs;
  return T.get(cle(rq, rr));
}
const coin = (t, i, k = 1) => { const a = Math.PI / 180 * (60 * i - 30); return [t.x + R * k * Math.cos(a), t.z + R * k * Math.sin(a)]; };
function bordCommun(t, n) {
  const mx = (t.x + n.x) / 2, mz = (t.z + n.z) / 2;
  return [0, 1, 2, 3, 4, 5].map(i => coin(t, i)).sort((a, b) => Math.hypot(a[0] - mx, a[1] - mz) - Math.hypot(b[0] - mx, b[1] - mz)).slice(0, 2);
}
for (const t of LISTE) if (t.t === 'mer' && voisins(t).some(n => !estEau(n))) t.t = 'cote';

// lieux : chacun sur son hexagone (le plus petit se pousse sur un voisin libre s'il y a déjà une ville)
const RANG = { capitale: 0, fort: 1, ville: 2, village: 3 };
const LIEUX = D.nodes.map((n, id) => ({ ...n, id })).sort((a, b) => RANG[a.t] - RANG[b.t] || b.p - a.p);
for (const n of LIEUX) {
  const [x, z] = kmVers(n.x, n.y); let t = versHex(x, z);
  if (!t) continue;
  if (t.lieu || estEau(t)) t = voisins(t).filter(v => !v.lieu && !estEau(v)).sort((a, b) => Math.hypot(a.x - x, a.z - z) - Math.hypot(b.x - x, b.z - z))[0] || t;
  if (t.lieu) continue;
  t.lieu = n; n.tuile = t;
  if (n.t !== 'village') t.t = 'ville';
}
// rivières : les vallées qu'elles traversent sont à plat
const RIVS = D.rivers.map(rv => ({ ...rv, p: rv.p.map(([x, y]) => kmVers(x, y)) }));
for (const rv of RIVS) for (const [x, z] of rv.p) {
  const t = versHex(x, z); if (!t || estEau(t)) continue;
  t.riv = Math.min(t.riv || 9, rv.k);
  if (t.t === 'colline' || t.t === 'montagne' || t.t === 'haute') t.t = rv.k < 3 || t.t === 'colline' ? 'prairie' : 'colline';

    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (!glisse && Math.hypot(e.clientX - dep0.x, e.clientY - dep0.y) > 6) { glisse = true; toile.classList.add('glisse'); survoler(null); }
    if (glisse) { const upp = 2 * distc * Math.tan(cam.fov * Math.PI / 360) / ZH; cible.x -= dx * upp; cible.z -= dy * upp / AXE.y; majCam(); }
    return;
  }
  if (e.pointerType === 'mouse') survoler(tuileSous(e.clientX, e.clientY), e.clientX, e.clientY);
});
const finPtr = e => { const etait = ptrs.has(e.pointerId); ptrs.delete(e.pointerId); toile.classList.remove('glisse'); if (etait && !glisse && e.type === 'pointerup' && ptrs.size === 0) choisir(tuileSous(e.clientX, e.clientY)); };
toile.addEventListener('pointerup', finPtr); toile.addEventListener('pointercancel', finPtr);
toile.addEventListener('pointerleave', () => survoler(null));
toile.addEventListener('wheel', e => { e.preventDefault(); distc = clamp(distc * Math.exp(e.deltaY * .0012), ZMIN, ZMAX); majCam(); }, { passive: false });

function majEchelle() {
  const kmPx = 2 * distc * Math.tan(cam.fov * Math.PI / 360) / ZH / S;
  const km = [1, 2, 5, 10, 20, 50, 100].find(k => k / kmPx >= 70) || 100;
  $('#ech-txt').textContent = km + ' km'; $('#ech-regle').style.width = Math.round(km / kmPx) + 'px';
}

// ============================================================ étiquettes (bannières de web_power/js/18-hud.js)
const ETI = $('#etiquettes'), V = new THREE.Vector3();
let voirVillages = true;
for (const n of LIEUX) {
  if (!n.tuile) continue;
  const fac = FACTIONS[n.d], el = document.createElement('div');
  if (n.t === 'village') { el.className = 'eti'; el.textContent = n.n; }
  else {
    el.className = 'ban' + (n.t === 'capitale' ? '' : ' ville') + (fac && (n.d === '24' || n.d === '64' || n.d === '47') ? ' sombre' : '');
    el.style.setProperty('--c', fac ? fac.col : NEUTRE);
    const pop = n.p >= 1000 ? Math.round(n.p / 1000) + 'k' : '·';
    el.innerHTML = `<span class="pop">${n.t === 'fort' ? '★' : pop}</span><span class="nom">${esc(n.n)}${n.t === 'capitale' ? `<small>${esc(fac ? fac.nom : '')}</small>` : ''}</span>`;
  }
  n.el = el; ETI.appendChild(el);
}
function majEtiquettes() {
  for (const n of LIEUX) {
    if (!n.el) continue;
    const vil = n.t === 'village', seuil = vil ? 300 : n.t === 'capitale' ? 9e9 : 900;
    if (distc > seuil || (vil && !voirVillages)) { n.el.hidden = true; continue; }
    const t = n.tuile; V.set(t.x, t.top + (vil ? 6 : 11), t.z).project(cam);
    if (V.z > 1 || Math.abs(V.x) > 1.1 || Math.abs(V.y) > 1.1) { n.el.hidden = true; continue; }
    n.el.hidden = false;
    const w = n.el.offsetWidth;
    n.el.style.transform = `translate(${Math.round((V.x + 1) / 2 * ZW - (vil ? w / 2 : 17))}px, ${Math.round((1 - V.y) / 2 * ZH - 17)}px)`;
  }
}

// ============================================================ survol, choix, panneau
const bulle = $('#bulle');
function survoler(t, x, y) {
  OBJ.survol.visible = !!t;
  if (!t) { bulle.hidden = true; demander(); return; }
  OBJ.survol.position.set(t.x, t.top + .3, t.z);
  bulle.hidden = false; bulle.style.left = x + 14 + 'px'; bulle.style.top = y + 14 + 'px';
  bulle.innerHTML = `<b>${esc(t.lieu ? t.lieu.n : TERR[t.t].nom)}</b><br>${esc(t.lieu ? TYPE[t.lieu.t] + ' · ' : '')}${esc(nomDep(t) || 'Océan')}`;
  demander();
}
const nomDep = t => t.dep ? NOM_DEP[t.dep] || t.dep : estEau(t) ? '' : 'Espagne';
const longueur = p => p.reduce((s, q, i) => i ? s + Math.hypot(q[0] - p[i - 1][0], q[1] - p[i - 1][1]) : 0, 0);
let choisie = null, onglet = 'lieu';
function choisir(t) {
  choisie = t; OBJ.choix.visible = !!t;
  if (t) OBJ.choix.position.set(t.x, t.top + .32, t.z);
  montrer('lieu'); demander();
}
function panneauLieu() {
  const t = choisie;
  if (!t) return `<h2>L'Aquitaine</h2><p class="sous">Touchez un hexagone pour voir son terrain, sa ville et ses routes.</p>
    <dl class="lignes"><dt>Plateau</dt><dd>${D.cols} × ${D.rows} hexagones</dd><dt>Un hexagone</dt><dd>${D.hexKm} km d'un bord à l'autre</dd>
    <dt>Étendue</dt><dd>${D.W} × ${D.H} km</dd><dt>Lieux</dt><dd>${LIEUX.length}</dd><dt>Routes</dt><dd>${D.roads.length}</dd></dl>
    <p class="note">Même géographie et même échelle que la carte du jeu : chaque hexagone prend le terrain majoritaire des cases de 1 km qu'il couvre (game/geo.py). Les vallées des rivières sont mises à plat.</p>`;
  const n = t.lieu, fac = FACTIONS[t.dep], [vit, couv, def] = REGLE[t.g] || REGLE.plaine;
  const km = [((t.x + OX) / S).toFixed(0), ((t.z + OZ) / S).toFixed(0)];
  let h = `<h2>${esc(n ? n.n : TERR[t.t].nom)}</h2><div class="sous">${n ? esc(TYPE[n.t]) + ' · ' : ''}${esc(nomDep(t) || 'Haute mer')}</div>
    <div class="chips"><span class="chip"><i style="background:${fac ? fac.col : NEUTRE}"></i>${esc(fac ? fac.nom : t.dep ? 'Hors du jeu' : estEau(t) ? 'Eaux' : 'Espagne')}</span><span class="chip">${esc(TERR[t.g === 'ocean' ? 'mer' : t.g].nom)}</span>${t.riv ? '<span class="chip">Rivière</span>' : ''}</div>`;
  if (n) {
    const rems = Array.from({ length: 4 }, (_, i) => `<span class="${i < n.f ? 'on' : ''}"></span>`).join('');
    h += `<h3>La place</h3><dl class="lignes"><dt>Âmes en 1700</dt><dd>${nf(n.p)}</dd><dt>Remparts</dt><dd><div class="jauge" title="Niveau ${n.f} sur 4">${rems}</div></dd>
      <dt>Garnison</dt><dd title="Valeur d'exemple">${n.t === 'village' ? 'Milice' : n.t === 'capitale' ? '2 régiments' : '1 compagnie'}</dd></dl>`;
    const rs = D.roads.filter(e => e.a === n.id || e.b === n.id).map(e => ({ e, o: D.nodes[e.a === n.id ? e.b : e.a], l: longueur(e.p) })).sort((a, b) => b.e.r - a.e.r || a.l - b.l);
    if (rs.length) h += `<h3>Routes (${rs.length})</h3><ul class="routes">${rs.map(({ e, o, l }) => `<li class="${e.r ? 'royale' : ''}">${esc(o.n)}<small>${e.r ? 'royale · ' : ''}${Math.round(l)} km</small></li>`).join('')}</ul>`;
    h += `<div class="actions"><button type="button" class="prim">Lever des troupes</button><button type="button">Fortifier</button><button type="button">Bâtir</button><button type="button">Commercer</button></div>`;
  }
  h += `<h3>Le terrain</h3><dl class="lignes"><dt>Marche hors route</dt><dd>${estEau(t) ? '—' : Math.round(vit * 100) + ' %'}</dd><dt>Couvert (embuscade)</dt><dd>${couv ? 'oui' : 'non'}</dd>
    <dt>Défense</dt><dd>${def > 1 ? '+' + Math.round((def - 1) * 100) + ' %' : '—'}</dd><dt>Position</dt><dd>${km[0]} km, ${km[1]} km</dd></dl>`;
  if (n) h += `<p class="note">Maquette : la garnison et les boutons sont des exemples, la population, les remparts et les routes viennent du jeu.</p>`;
  return h;
}
function panneauPays() {
  return `<h2>Les cinq pays</h2><p class="sous">Vous jouez la Gironde. Touchez un pays pour aller à son chef-lieu.</p>` + Object.entries(FACTIONS).map(([code, f]) => {
    const ns = LIEUX.filter(n => n.d === code), villes = ns.filter(n => n.t !== 'village').length, ames = ns.reduce((s, n) => s + n.p, 0);
    return `<button type="button" class="fac${code === MOI ? ' moi' : ''}" style="--c:${f.col}" data-cap="${esc(f.cap)}"><span class="blason"></span><b>${esc(f.nom)}</b><span class="nb">${villes} places · ${ns.length - villes} villages</span><small>${esc(f.titre)} · ${esc(f.cap)} · ${nf(ames)} âmes</small></button>`;
  }).join('');
}
function montrer(o) {
  onglet = o;
  $('#o-lieu').setAttribute('aria-selected', o === 'lieu'); $('#o-roy').setAttribute('aria-selected', o === 'roy');
  $('#contenu').innerHTML = o === 'lieu' ? panneauLieu() : panneauPays();
}
$('#o-lieu').onclick = () => montrer('lieu'); $('#o-roy').onclick = () => montrer('roy');
$('#contenu').addEventListener('click', e => {
  const b = e.target.closest('[data-cap]'); if (!b) return;
  const n = LIEUX.find(x => x.n === b.dataset.cap); if (!n?.tuile) return;
  cible.set(n.tuile.x, 0, n.tuile.z); distc = 330; majCam(); choisir(n.tuile);
});
const bascule = (id, f) => { const b = $(id); b.onclick = () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); f(on); demander(); }; };
bascule('#l-dep', on => { OBJ.teinte.visible = on; });
bascule('#l-rou', on => { OBJ.routes.visible = on; });
bascule('#l-vil', on => { voirVillages = on; });

// ============================================================ démarrage
requestAnimationFrame(() => {
  construire();
  const bx = LIEUX.find(n => n.n === 'Bordeaux').tuile; cible.set(bx.x, 0, bx.z);
  new ResizeObserver(redim).observe(zone); redim();
  montrer('lieu'); $('#chargement').remove();
  (function boucle() { if (sale) { sale = false; renderer.render(scene, cam); majEtiquettes(); } requestAnimationFrame(boucle); })();
});
</script>
</body>
