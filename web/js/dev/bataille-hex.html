<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Batailles en hexagones</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Maquette : des batailles de Conquête (rase campagne, place forte, ville, village, collines) refaites en plateau d'hexagones, style web_power (GridMaster), suite de carte-hex.html.
   Même champ de bataille et même échelle que le jeu (3 000 × 2 000 m), 1 hexagone = 40 m ; les régiments à leur place,
   dans leur formation. Champ à gauche, panneau à droite ; en portrait, panneau dessous. Un seul thème sombre, par choix. */
:root {
  color-scheme: dark;
  --fond: #1b211a; --fond2: #253021; --fond3: #2a3327; --bord: #0f130e; --trait: #2b1d14; --sol: #141813;
  --txt: #f6f4ea; --doux: #b3bca5; --gris: #a9b39a; --or: #ffc94d; --vert: #7be08a; --rouge: #ff8a7a; --creme: #fff7e6;
  --titre: Fredoka, "Trebuchet MS", system-ui, sans-serif; --corps: Nunito, "Segoe UI", system-ui, sans-serif;
  --ombre: 0 4px 0 rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sol); color: var(--txt); font-family: var(--corps); }
button { font-family: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--vert); outline-offset: 2px; }
#app { display: grid; grid-template-rows: 60px minmax(0, 1fr); grid-template-columns: minmax(0, 1fr) 380px; height: 100%; }
.barre { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding-block: 0; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--fond); border-bottom: 3px solid var(--bord); min-width: 0; }
.titre-date { font-family: var(--titre); font-weight: 600; font-size: 19px; line-height: 1.15; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titre-date small { display: block; font: 800 11px var(--corps); color: var(--gris); }
.badge { flex: none; padding: 2px 8px; border-radius: 8px; background: var(--creme); color: var(--trait); font-weight: 800; font-size: 11px; border: 2px solid var(--bord); }
.badge.phase { background: var(--or); }
.forces { display: flex; align-items: center; gap: 6px; margin-left: auto; min-width: 0; }
.force { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 12px; background: var(--fond2); border: 2px solid var(--bord); font-weight: 800; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.force i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--bord); background: var(--c); }
.contre { font-family: var(--titre); color: var(--gris); }
.lancer { flex: none; min-height: 38px; padding: 0 14px; border-radius: 12px; border: 2.5px solid var(--bord); background: var(--or); color: var(--trait); font-weight: 800; font-size: 14px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.35); }

main { position: relative; overflow: hidden; background: #2d6aa0; min-width: 0; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#scene.glisse { cursor: grabbing; }
#etiquettes { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.ban { position: absolute; left: 0; top: 0; display: flex; align-items: center; white-space: nowrap; filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)); will-change: transform; }
.ban .pop { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--fond); border: 2.5px solid var(--bord); color: var(--txt); font-family: var(--titre); font-weight: 700; font-size: 10.5px; z-index: 1; font-variant-numeric: tabular-nums; }
.ban .nom { margin-left: -8px; padding: 2px 10px 2px 12px; border-radius: 0 10px 10px 0; background: var(--c); color: var(--txt); border: 2.5px solid var(--bord); font-family: var(--titre); font-weight: 700; font-size: 13px; line-height: 1.1; }
.ban .nom small { display: block; font-family: var(--corps); font-weight: 800; font-size: 10px; opacity: .85; }
.ban.choisi .pop { background: var(--or); color: var(--trait); }
.flottant { position: absolute; z-index: 3; background: var(--fond); border: 2.5px solid var(--bord); border-radius: 16px; box-shadow: var(--ombre); }
.temps { left: max(12px, env(safe-area-inset-left, 0px)); top: 12px; display: flex; gap: 3px; padding: 4px; font-variant-numeric: tabular-nums; }
.temps button, .temps span { min-width: 42px; min-height: 36px; padding: 0 10px; border: 0; border-radius: 11px; background: transparent; font: 800 13px var(--corps); display: grid; place-items: center; }
.temps button { cursor: pointer; }
.temps button.actif { background: var(--or); color: var(--trait); }
.lentilles { right: 12px; top: 12px; display: flex; flex-direction: column; gap: 4px; padding: 6px; }
.lentilles button { min-height: 30px; padding: 0 10px; border-radius: 10px; border: 2px solid var(--bord); background: var(--fond2); font-weight: 800; font-size: 12px; text-align: left; cursor: pointer; }
.lentilles button[aria-pressed="true"] { background: var(--or); color: var(--trait); }
.echelle { left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; padding: 6px 10px 7px; font-weight: 800; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.echelle .regle { height: 8px; margin-top: 4px; border: 2.5px solid var(--txt); border-top: 0; }
.scenarios { left: 50%; transform: translateX(-50%); bottom: 12px; max-width: calc(100% - 300px); display: flex; gap: 6px; padding: 6px; overflow-x: auto; }
.scen { flex: none; width: 128px; padding: 6px 8px; border-radius: 12px; border: 2px solid var(--bord); background: var(--fond2); cursor: pointer; display: flex; flex-direction: column; gap: 1px; text-align: left; }
.scen b { font-family: var(--titre); font-weight: 600; font-size: 13.5px; line-height: 1.15; }
.scen span { font-size: 11px; font-weight: 700; color: var(--doux); }
.scen[aria-pressed="true"] { background: var(--or); color: var(--trait); } .scen[aria-pressed="true"] span { color: var(--trait); }
.bulle { position: fixed; z-index: 9; pointer-events: none; padding: 6px 10px; border-radius: 11px; background: var(--creme); color: var(--trait); border: 2px solid var(--bord); font-size: 12px; font-weight: 800; max-width: 260px; }
.bulle b { font-family: var(--titre); font-weight: 600; font-size: 14px; }

aside { display: flex; flex-direction: column; min-height: 0; background: var(--fond); border-left: 3px solid var(--bord); }
.onglets { display: flex; gap: 4px; padding: 8px 10px 6px; border-bottom: 2px solid var(--fond2); }
.onglets button { min-height: 32px; padding: 0 12px; border-radius: 10px; border: 2px solid var(--bord); background: var(--fond2); font-weight: 800; font-size: 12.5px; cursor: pointer; }
.onglets button[aria-selected="true"] { background: var(--or); color: var(--trait); }
#contenu { flex: 1; overflow-y: auto; padding: 6px 16px 24px; }
h2 { font-family: var(--titre); font-weight: 600; font-size: 24px; margin: 8px 0 2px; text-wrap: balance; }
h3 { font-family: var(--titre); font-weight: 600; font-size: 15px; margin: 18px 0 6px; color: var(--doux); }
.sous { color: var(--gris); font-weight: 700; font-size: 13px; }
.lignes { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13.5px; align-items: center; }
.lignes dt { color: var(--gris); font-weight: 700; }
.lignes dd { margin: 0; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
.barre-v { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.barre-v span { width: 110px; height: 10px; border-radius: 6px; border: 2px solid var(--bord); background: var(--fond3); overflow: hidden; }
.barre-v span i { display: block; height: 100%; background: var(--c, var(--vert)); }
.regs { display: grid; gap: 5px; }
.reg { display: grid; grid-template-columns: 12px 1fr auto; gap: 2px 10px; align-items: center; width: 100%; padding: 7px 10px; border-radius: 12px; border: 2.5px solid var(--bord); background: var(--fond2); text-align: left; cursor: pointer; }
.reg i { grid-row: span 2; width: 12px; height: 28px; border-radius: 4px; border: 2px solid var(--bord); background: var(--c); }
.reg b { font-family: var(--titre); font-weight: 600; font-size: 14.5px; }
.reg small { color: var(--gris); font-weight: 700; font-size: 11.5px; }
.reg .n { grid-row: span 2; font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; }
.reg[aria-current="true"] { border-color: var(--or); }
.formes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.formes button, .actions button { min-height: 38px; border-radius: 12px; border: 2.5px solid var(--bord); background: var(--fond2); font-weight: 800; font-size: 12.5px; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
.formes button[aria-pressed="true"] { background: var(--creme); color: var(--trait); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.actions button.prim { background: var(--or); color: var(--trait); }
.note { margin-top: 14px; color: var(--gris); font-size: 12px; font-weight: 700; line-height: 1.45; }
.chargement { position: absolute; inset: 0; display: grid; place-items: center; z-index: 5; font-family: var(--titre); font-size: 18px; background: var(--fond); }

@media (max-width: 900px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 52px minmax(0, 1fr) minmax(0, 42%); }
  aside { border-left: 0; border-top: 3px solid var(--bord); }
  .forces, .titre-date small, .badge:not(.phase) { display: none; }
  .titre-date { font-size: 15px; } .barre { gap: 6px; } .lancer { margin-left: auto; padding: 0 10px; font-size: 13px; }
  .temps { display: none; }
  .lentilles { right: max(12px, env(safe-area-inset-right, 0px)); }
  .echelle { bottom: auto; top: 12px; }
  .scenarios { max-width: calc(100% - 24px); left: 12px; transform: none; }
  .scen { width: 112px; } .scen span { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <header class="barre">
    <div class="titre-date" id="titre">Bataille</div>
    <span class="badge phase">DÉPLOIEMENT</span>
    <span class="badge">MAQUETTE</span>
    <div class="forces" id="forces"></div>
    <button type="button" class="lancer">Lancer la bataille ▸</button>
  </header>
  <main id="zone">
    <canvas id="scene" aria-label="Champ de bataille en hexagones"></canvas>
    <div id="etiquettes"></div>
    <div class="flottant temps" role="group" aria-label="Temps">
      <button type="button" class="actif">❚❚</button><button type="button">×1</button><button type="button">×4</button><span>8 h 00</span>
    </div>
    <div class="flottant lentilles" role="group" aria-label="Calques">
      <button type="button" id="l-por" aria-pressed="true">Portées</button>
      <button type="button" id="l-nom" aria-pressed="true">Noms</button>
      <button type="button" id="l-hex" aria-pressed="false">Grille</button>
    </div>
    <div class="flottant echelle"><span id="ech-txt">100 m</span><div class="regle" id="ech-regle"></div></div>
    <div class="flottant scenarios" id="scenarios" role="group" aria-label="Style de bataille"></div>
    <div class="chargement" id="chargement">Les régiments prennent position…</div>
  </main>
  <aside>
    <div class="onglets" role="tablist">
      <button type="button" role="tab" id="o-reg" aria-selected="true">Mes régiments</button>
      <button type="button" role="tab" id="o-obs" aria-selected="false">Ordre de bataille</button>
    </div>
    <div id="contenu"></div>
  </aside>
</div>
<div class="bulle" id="bulle" hidden></div>

<script src="bataille-hex-data.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
const $ = s => document.querySelector(s);
const nf = n => Math.round(n).toLocaleString('fr-FR');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ============================================================ données du jeu (game/tactics, mode Bataille)
const TOUS = BATAILLES_HEX, D0 = TOUS[0];   // toutes au même format : 3 000 × 2 000 m, hexagones de 40 m
let D = D0, MOI = 0, H0 = 0;
const R = 10, SQ3 = Math.sqrt(3), RK = D0.hexM / SQ3, S = R / RK;   // S : unités 3D par mètre
const OX = D0.W * S / 2, OZ = D0.H * S / 2;
const mVers = (x, y) => [x * S - OX, y * S - OZ];
const FAC = D0.factions, colSide = s => FAC[D.sides[s]].col;
const ICI = '33';   // le joueur : la Gironde (outils/bataille_hex.py)
const SOL = {
  PRE: { col: 0x84c450 }, CHAMP: { col: 0xc9c65c }, VIGNE: { col: 0xb4b660 }, LANDE: { col: 0xaaa762 }, BOIS: { col: 0x6aa843 }, FORET: { col: 0x4e8a34 },
  MARAIS: { col: 0x6f9e6a }, EAU: { col: 0xd2c88f, eau: 1 }, GUE: { col: 0xd2c88f, eau: 1 }, ROUTE: { col: 0xcfc3a3 }, CHEMIN: { col: 0xd9c79a }, BATI: { col: 0xcfc3a3 },
  MUR: { col: 0xbfb39a }, BRECHE: { col: 0xa79a7a }, PORTE: { col: 0xcfc3a3 }, SABLE: { col: 0xead9a2 }, ROCHE: { col: 0x9c968c }, BARRICADE: { col: 0xb59a6a }, VERGER: { col: 0x8cc45a },
};
const FORME = { ligne: 'Ligne', colonne: 'Colonne', carre: 'Carré', tirailleurs: 'Tirailleurs', batterie: 'En batterie', avanttrain: 'Attelée' };
const ETAT = { repos: 'Au repos', marche: 'En marche', feu: 'Fait feu', melee: 'Mêlée', deroute: 'En déroute' };

// ============================================================ hasard (repris de web_power)
function hache(x, y, s = 7) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
let g = 1;
function rnd() { g = (g + 0x6D2B79F5) | 0; let t = Math.imul(g ^ (g >>> 15), 1 | g); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const semer = (a, b) => { g = a * 7919 + b * 104729 + 13; };
const entre = (a, b) => a + rnd() * (b - a);

// ============================================================ grille (pointe en haut, axiale)
const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
const cle = (q, r) => q + ',' + r;
const T = new Map(), LISTE = [];
function grille() {
  T.clear(); LISTE.length = 0; H0 = Math.min(...D.h);
  for (let row = 0; row < D.rows; row++) for (let col = 0; col < D.cols; col++) {
    const i = row * D.cols + col, r = row, q = col - (row - (row & 1)) / 2;
    const t = { q, r, col, row, x: R * SQ3 * (q + r / 2) - OX, z: R * 1.5 * r - OZ, t: D.types[D.ter.charCodeAt(i) - 65], hm: D.h[i] };
    t.top = (t.hm - H0) * S * 1.6 - (SOL[t.t].eau ? 2.4 : 0);   // relief du moteur, un peu accentué
    T.set(cle(q, r), t); LISTE.push(t);
  }
}
const voisins = t => DIRS.map(([a, b]) => T.get(cle(t.q + a, t.r + b))).filter(Boolean);
function versHex(x, z) {
  x += OX; z += OZ;
  const q = (SQ3 / 3 * x - z / 3) / R, r = (2 / 3 * z) / R, s = -q - r;
  let rq = Math.round(q), rr = Math.round(r); const rs = Math.round(s);
  const dq = Math.abs(rq - q), dr = Math.abs(rr - r), ds = Math.abs(rs - s);
  if (dq > dr && dq > ds) rq = -rr - rs; else if (dr > ds) rr = -rq - rs;
  return T.get(cle(rq, rr));
}
const solEn = (x, z) => { const t = versHex(x, z); return t ? Math.max(t.top, -.4) : 0; };

// ============================================================ moteur 3D (repris de web_power/js/03-moteur-3d.js)
const toile = $('#scene'), zone = $('#zone');
const renderer = new THREE.WebGLRenderer({ canvas: toile, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b211a);
const cam = new THREE.PerspectiveCamera(30, 1, 5, 5000);
const ciel = new THREE.HemisphereLight(0xeef7ff, 0x7d8466, 1.5); scene.add(ciel);
const soleil = new THREE.DirectionalLight(0xfff0d4, 2.6), SOL_DEC = new THREE.Vector3(-170, 300, 160);
let MONDE = new THREE.Group(); scene.add(MONDE);
function ambiance() {
  const gris = D.weather === 'pluie' || D.weather === 'brouillard' || D.weather === 'nuages';
  scene.fog = gris ? new THREE.Fog(0x8d9a8c, D.weather === 'brouillard' ? 500 : 1200, D.weather === 'brouillard' ? 1500 : 2800) : null;
  ciel.intensity = gris ? 1.35 : 1.5; soleil.intensity = gris ? 2.1 : 2.6; soleil.color.set(gris ? 0xe6ecf0 : D.season === 'automne' ? 0xffe2b8 : 0xfff0d4);
}
function vider() {
  MONDE.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material && ![MAT, CONT].includes(o.material)) o.material.dispose(); });
  scene.remove(MONDE); MONDE = new THREE.Group(); scene.add(MONDE); OBJ.portee = null;
}
soleil.castShadow = true;
Object.assign(soleil.shadow.camera, { left: -300, right: 300, top: 260, bottom: -260, near: 10, far: 1000 });
soleil.shadow.mapSize.set(4096, 4096); soleil.shadow.bias = -.0006; soleil.shadow.normalBias = .4;
scene.add(soleil, soleil.target);
const degrade = new THREE.DataTexture(new Uint8Array([105, 190, 255]), 3, 1, THREE.RedFormat);
degrade.minFilter = degrade.magFilter = THREE.NearestFilter; degrade.needsUpdate = true;
const MAT = new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: degrade });
const CONT = new THREE.MeshBasicMaterial({ color: 0x24180f, side: THREE.BackSide });
const VA = new THREE.Vector3(), VB = new THREE.Vector3();
const lot = () => ({ g: [], o: [] });
function put(L, geo, col, x = 0, y = 0, z = 0, ry = 0, ep = .26) {
  if (geo.index) geo = geo.toNonIndexed();
  if (geo.attributes.uv) geo.deleteAttribute('uv');
  if (!geo.attributes.normal) geo.computeVertexNormals();
  if (ry) geo.rotateY(ry);
  geo.translate(x, y, z);
  const c = new THREE.Color(col), n = geo.attributes.position.count, a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) a.set([c.r, c.g, c.b], i * 3);
  geo.setAttribute('color', new THREE.BufferAttribute(a, 3));
  L.g.push(geo);
  if (ep) {
    const o = geo.clone(); o.computeBoundingBox(); o.boundingBox.getCenter(VA); o.boundingBox.getSize(VB);
    o.translate(-VA.x, -VA.y, -VA.z);
    o.scale((VB.x + 2 * ep) / Math.max(VB.x, 1e-3), (VB.y + 2 * ep) / Math.max(VB.y, 1e-3), (VB.z + 2 * ep) / Math.max(VB.z, 1e-3));
    o.translate(VA.x, VA.y, VA.z); L.o.push(o);
  }
  return geo;
}
// pose un modèle local (x vers l'avant, z vers la droite) à (x, y, z), tourné de ry
function transfere(src, L, x, y, z, ry = 0) { for (const k of ['g', 'o']) for (const geo of src[k]) { if (ry) geo.rotateY(ry); geo.translate(x, y, z); L[k].push(geo); } }
function fige(L, mat = MAT, ombre = true) {
  const grp = new THREE.Group();
  if (L.g.length) { const m = new THREE.Mesh(mergeGeometries(L.g), mat); m.castShadow = ombre; m.receiveShadow = true; grp.add(m); }
  if (L.o.length) grp.add(new THREE.Mesh(mergeGeometries(L.o), CONT));
  MONDE.add(grp); return grp;
}
const boite = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const cyl = (rt, rb, h, s = 10) => new THREE.CylinderGeometry(rt, rb, h, s);
const cone = (r, h, s = 8) => new THREE.ConeGeometry(r, h, s);
const sphere = (r, d = 1) => new THREE.IcosahedronGeometry(r, d);
function toit(L, w, d, h, col, x, y, z, ry = 0) {
  const p = cyl(1, 1, d, 3); p.rotateX(Math.PI / 2); p.rotateZ(Math.PI / 2); p.scale(h / 1.5, w / SQ3, 1); p.translate(0, h / 2 - h / 3, 0);
  put(L, p, col, x, y + h / 6, z, ry);
}
function ruban(pts, larg) {
  const pos = [];
  const perp = i => { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)], dx = b[0] - a[0], dz = b[2] - a[2], l = Math.hypot(dx, dz) || 1; return [-dz / l, dx / l]; };

  for (let k = 0; k < 3; k++) { PL.constant = -y; if (!ray.ray.intersectPlane(PL, PT)) return null; t = versHex(PT.x, PT.z); if (!t) return null; y = Math.max(t.top, -.6); }
  return { t, x: PT.x, z: PT.z };
}
// le régiment sous le point : dans son emprise (w × d, tournée selon dir), avec une marge
function uniteSous(p) {
  if (!p) return null;
  return D.units.find(u => {
    const [ux, , uz] = u.p3, dx = p.x - ux, dz = p.z - uz, fx = Math.cos(u.dir), fz = Math.sin(u.dir);
    const av = dx * fx + dz * fz, co = -dx * fz + dz * fx;
    return Math.abs(co) <= u.w * S / 2 + 3 && av <= 4 && av >= -(u.d * S + 4);
  }) || null;
}
const ZMIN = 50, ZMAX = 1300;
const ptrs = new Map(); let glisse = false, dep0 = null, pinch0 = 0, dist0 = 0;
toile.addEventListener('pointerdown', e => {
  toile.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); dep0 = { x: e.clientX, y: e.clientY }; glisse = false;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); dist0 = distc; }
});
toile.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (p) {
    if (ptrs.size === 2) { p.x = e.clientX; p.y = e.clientY; const [a, b] = [...ptrs.values()]; distc = clamp(dist0 * pinch0 / Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)), ZMIN, ZMAX); majCam(); glisse = true; return; }
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (!glisse && Math.hypot(e.clientX - dep0.x, e.clientY - dep0.y) > 6) { glisse = true; toile.classList.add('glisse'); survoler(null); }
    if (glisse) { const upp = 2 * distc * Math.tan(cam.fov * Math.PI / 360) / ZH; cible.x -= dx * upp; cible.z -= dy * upp / AXE.y; majCam(); }
    return;
  }
  if (e.pointerType === 'mouse') survoler(pointSous(e.clientX, e.clientY), e.clientX, e.clientY);
});
const finPtr = e => { const etait = ptrs.has(e.pointerId); ptrs.delete(e.pointerId); toile.classList.remove('glisse'); if (etait && !glisse && e.type === 'pointerup' && ptrs.size === 0) { const p = pointSous(e.clientX, e.clientY); choisir(uniteSous(p), p); } };
toile.addEventListener('pointerup', finPtr); toile.addEventListener('pointercancel', finPtr);
toile.addEventListener('pointerleave', () => survoler(null));
toile.addEventListener('wheel', e => { e.preventDefault(); distc = clamp(distc * Math.exp(e.deltaY * .0012), ZMIN, ZMAX); majCam(); }, { passive: false });
function majEchelle() {
  const mPx = 2 * distc * Math.tan(cam.fov * Math.PI / 360) / ZH / S;
  const m = [10, 20, 50, 100, 200, 500, 1000].find(k => k / mPx >= 70) || 1000;
  $('#ech-txt').textContent = m >= 1000 ? m / 1000 + ' km' : m + ' m'; $('#ech-regle').style.width = Math.round(m / mPx) + 'px';
}

// ============================================================ bannières des régiments
const ETI = $('#etiquettes'), V = new THREE.Vector3();
let voirNoms = true, voirPortees = true, voirGrille = false;
function bannieres() {
  ETI.textContent = '';
  for (const u of D.units) {
    const el = document.createElement('div');
    el.className = 'ban'; el.style.setProperty('--c', colSide(u.side));
    el.innerHTML = `<span class="pop">${u.cls === 'general' ? '★' : u.cls === 'chariot' ? '⛁' : u.men}</span><span class="nom">${esc(u.cls === 'chariot' ? 'Munitions' : u.name)}<small>${esc(u.cls === 'general' ? 'Général' : FORME[u.form] || u.form)}</small></span>`;
    u.el = el; ETI.appendChild(el);
  }
}
function majEtiquettes() {
  for (const u of D.units) {
    if (!voirNoms || (u.cls === 'chariot' && distc > 260)) { u.el.hidden = true; continue; }
    V.set(u.p3[0], u.p3[1] + K * 4, u.p3[2]).project(cam);
    if (V.z > 1 || Math.abs(V.x) > 1.1 || Math.abs(V.y) > 1.1) { u.el.hidden = true; continue; }
    u.el.hidden = false; u.el.classList.toggle('choisi', u === choisie);
    u.el.style.transform = `translate(${Math.round((V.x + 1) / 2 * ZW - 15)}px, ${Math.round((1 - V.y) / 2 * ZH - 15)}px)`;
  }
}

// ============================================================ survol, choix, panneau
const bulle = $('#bulle');
function survoler(p, x, y) {
  if (!p) { bulle.hidden = true; return; }
  const u = uniteSous(p);
  bulle.hidden = false; bulle.style.left = x + 14 + 'px'; bulle.style.top = y + 14 + 'px';
  bulle.innerHTML = u ? `<b>${esc(u.name)}</b><br>${u.men} hommes · ${esc(FORME[u.form] || u.form)}` : `<b>${esc(D.labels[D.types.indexOf(p.t.t)])}</b><br>Altitude ${p.t.hm} · ${Math.round((p.x + OX) / S)} m, ${Math.round((p.z + OZ) / S)} m`;
}
let choisie = null, onglet = 'reg';
function choisir(u, p) {
  choisie = u; eventail(u);
  if (u) montrer('reg'); demander();
}
const pc = (v, max) => Math.round(clamp(v / max, 0, 1) * 100);
const jauge = (v, max, col) => `<div class="barre-v"><span style="--c:${col}"><i style="width:${pc(v, max)}%"></i></span>${v}</div>`;
function ficheUnite(u) {
  const formes = u.cls === 'inf' ? ['ligne', 'colonne', 'carre', 'tirailleurs'] : u.cls === 'cavalerie' ? ['ligne', 'colonne'] : u.cls === 'artillerie' ? ['batterie', 'avanttrain'] : [];
  return `<h2>${esc(u.name)}</h2><div class="sous">${esc(FAC[u.owner].nom)} · ${esc(u.gname || '')}</div>
    <h3>Le régiment</h3><dl class="lignes">
    <dt>Hommes</dt><dd>${jauge(u.men, u.men0, 'var(--vert)')}</dd><dt>Moral</dt><dd>${jauge(u.morale, 100, 'var(--or)')}</dd>
    <dt>Fatigue</dt><dd>${jauge(u.fat, 100, 'var(--rouge)')}</dd><dt>Munitions</dt><dd>${jauge(u.ammo, u.ammo0, '#7cc0f2')}</dd>
    <dt>État</dt><dd>${esc(ETAT[u.state] || u.state)}</dd>${u.pieces ? `<dt>Pièces</dt><dd>${u.pieces}</dd>` : ''}
    <dt>Front × profondeur</dt><dd>${Math.round(u.w)} × ${Math.round(u.d)} m</dd><dt>Portée efficace</dt><dd>${u.range[0]} m</dd><dt>Portée maximale</dt><dd>${u.range[1]} m</dd>${u.range[2] ? `<dt>Mitraille</dt><dd>${u.range[2]} m</dd>` : ''}</dl>`
    + (u.side === MOI && formes.length ? `<h3>Formation</h3><div class="formes">${formes.map(f => `<button type="button" aria-pressed="${f === u.form}">${FORME[f]}</button>`).join('')}</div>` : '')
    + (u.side === MOI ? `<h3>Ordres</h3><div class="actions"><button type="button" class="prim">Avancer</button><button type="button">Tenir la position</button><button type="button">${u.cls === 'cavalerie' ? 'Charger' : 'Feu à volonté'}</button><button type="button">Se replier</button></div>
      <p class="note">Maquette : les boutons ne font rien. Les effectifs, l'emprise, les portées et la place du régiment viennent du jeu.</p>` : '<p class="note">Régiment ennemi repéré.</p>');
}
function listeRegs(side) {
  return `<div class="regs">${D.units.filter(u => u.side === side).map(u => `<button type="button" class="reg" style="--c:${colSide(side)}" data-u="${D.units.indexOf(u)}" aria-current="${u === choisie}"><i></i><b>${esc(u.cls === 'chariot' ? 'Chariot de munitions' : u.name)}</b><span class="n">${u.cls === 'general' ? '★' : u.men}</span><small>${esc(u.cls === 'general' ? 'Général en chef' : FORME[u.form] || u.form)} · moral ${u.morale}</small></button>`).join('')}</div>`;
}
function montrer(o) {
  onglet = o;
  $('#o-reg').setAttribute('aria-selected', o === 'reg'); $('#o-obs').setAttribute('aria-selected', o === 'obs');
  if (o === 'reg') $('#contenu').innerHTML = choisie ? ficheUnite(choisie) + `<h3>Mes régiments</h3>` + listeRegs(MOI)
    : `<h2>Déployez vos troupes</h2><p class="sous">Touchez un régiment pour voir sa fiche et ses portées.</p>${listeRegs(MOI)}`;
  else $('#contenu').innerHTML = `<h2>Ordre de bataille</h2><dl class="lignes"><dt>Lieu</dt><dd>${esc(lieu)}</dd><dt>Date</dt><dd>${esc(D.date)}</dd><dt>Temps</dt><dd>${esc(meteo)}</dd>
      <dt>Champ de bataille</dt><dd>${D.W} × ${D.H} m</dd><dt>Un hexagone</dt><dd>${D.hexM} m</dd><dt>Plateau</dt><dd>${D.cols} × ${D.rows}</dd></dl>`
    + [0, 1].map(s => `<h3>${esc(FAC[D.sides[s]].nom)}${s === MOI ? ' (vous)' : ''} · ${nf(effectif(s))} hommes</h3>${listeRegs(s)}`).join('');
}
const effectif = s => D.units.filter(u => u.side === s && u.cls !== 'chariot').reduce((a, u) => a + u.men, 0);
let lieu = '', meteo = '';
$('#o-reg').onclick = () => montrer('reg'); $('#o-obs').onclick = () => montrer('obs');
$('#contenu').addEventListener('click', e => {
  const b = e.target.closest('[data-u]'); if (!b) return;
  const u = D.units[+b.dataset.u]; cible.set(u.p3[0], 0, u.p3[2]); majCam(); choisir(u);
});
const bascule = (id, f) => { const b = $(id); b.onclick = () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); f(on); demander(); }; };
bascule('#l-por', on => { voirPortees = on; eventail(choisie); });
bascule('#l-nom', on => { voirNoms = on; });
bascule('#l-hex', on => { voirGrille = on; OBJ.grille.visible = on; });
const cap = s => s[0].toUpperCase() + s.slice(1);
$('#scenarios').innerHTML = TOUS.map(b => `<button type="button" class="scen" data-b="${b.id}" aria-pressed="false"><b>${esc(b.style)}</b><span>${esc(b.lieu || cap(b.region))} · ${esc(b.date.split(' ')[0].toLowerCase())}</span></button>`).join('');
$('#scenarios').addEventListener('click', e => { const b = e.target.closest('[data-b]'); if (b) location.hash = b.dataset.b; });
addEventListener('hashchange', () => charger(location.hash.slice(1)));
// une bataille : le plateau, les troupes, les bannières et le panneau sont refaits
function charger(id) {
  const nd = TOUS.find(b => b.id === id) || D0;
  if (nd === D && MONDE.children.length) return;
  vider(); D = nd; MOI = D.sides.indexOf(ICI); choisie = null;
  for (const b of document.querySelectorAll('.scen')) b.setAttribute('aria-pressed', b.dataset.b === D.id);
  lieu = D.lieu ? `${D.lieu} (${D.region})` : D.region; meteo = cap(D.weather);
  grille(); ambiance(); construireSol(); construireTroupes(); bannieres();
  $('#titre').innerHTML = `${esc(D.style)}${D.lieu ? ' · ' + esc(D.lieu) : ''}<small>${esc(D.date)} · ${esc(meteo)} · ${esc(D.region)}</small>`;
  $('#forces').innerHTML = [0, 1].map(s => `<span class="force" style="--c:${colSide(s)}"><i></i>${esc(FAC[D.sides[s]].nom)} ${nf(effectif(s))}</span>`).join('<span class="contre">contre</span>');
  // la caméra : sur mes troupes, ou entre elles et la place quand il y en a une
  const mes = D.units.filter(u => u.side === MOI), mx = mes.reduce((a, u) => a + u.p3[0], 0) / mes.length, mz = mes.reduce((a, u) => a + u.p3[2], 0) / mes.length;
  if (D.town) { const [tx, tz] = mVers(D.town.x, D.town.y); cible.set((mx + tx) / 2, 0, (mz + tz) / 2); distc = 420; } else { cible.set(mx, 0, mz); distc = 210; }
  majCam(); choisir(mes[0]);
}

// ============================================================ démarrage
requestAnimationFrame(() => {
  new ResizeObserver(redim).observe(zone); redim();
  charger(location.hash.slice(1)); $('#chargement').remove();
  (function boucle() { if (sale) { sale = false; renderer.render(scene, cam); majEtiquettes(); } requestAnimationFrame(boucle); })();
});
</script>
