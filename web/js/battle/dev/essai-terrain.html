<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000">
<canvas id="c"></canvas>
<script type="module">
import { Terrain } from '../terrain.js';
import { TILT } from '../formes.js';
const q = new URLSearchParams(location.search);
const bid = q.get('bid') || 'bocage';
const m = await (await fetch('/api/tactic_map?bid=' + bid)).json();
const prof = {};
for (const k of ['prepare','regionPath','prepTrees','prepShade','prepContours','prepPaths','prepCover','paintCanvas']) {
  const f = Terrain.prototype[k];
  Terrain.prototype[k] = function (...a) { const t = performance.now(); const r = f.apply(this, a); prof[k] = (prof[k] || 0) + performance.now() - t; return r; };
}
const t0 = performance.now();
Terrain.prototype.prof = {};
const T = new Terrain(m);
const t1 = performance.now();
const cv = document.getElementById('c'), dpr = devicePixelRatio, vw = innerWidth, vh = innerHeight;
cv.width = vw * dpr; cv.height = vh * dpr; cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
const g = cv.getContext('2d');
const cam = { x: +(q.get('x') || 1500), y: +(q.get('y') || 1000), z: +(q.get('z') || 0.4) };
function draw(budget) {
  g.setTransform(dpr * cam.z, 0, 0, dpr * cam.z * TILT, dpr * (vw / 2 - cam.x * cam.z), dpr * (vh / 2 - cam.y * cam.z * TILT));
  return T.draw(g, cam, vw, vh / TILT, dpr, budget);
}
let n = 0; while (draw(4) && n++ < 30);
const t2 = performance.now();
window.__ok = { prep: Math.round(t1 - t0), tiles: Math.round(t2 - t1), prof: Object.fromEntries(Object.entries(prof).map(([k, v]) => [k, Math.round(v)])), regions: T.regions.length, paint: Object.fromEntries(Object.entries(T.prof).map(([k, v]) => [k, Math.round(v)])) };
document.title = 'ok';
</script>
