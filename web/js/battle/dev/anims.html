<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Essai des animations</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bcd0dc; font: 13px/1.2 Georgia, serif; touch-action: none; }
  canvas { display: block; }
  .lab { position: absolute; transform: translate(-50%, -100%); color: #fff; background: rgba(20, 28, 40, 0.75); padding: 2px 6px; border-radius: 3px; white-space: nowrap; pointer-events: none; }
  #info { position: absolute; left: 10px; top: 8px; color: #1d2430; background: rgba(255, 255, 255, 0.7); padding: 6px 10px; border-radius: 4px; }
</style>
</head>
<body>
<div id="info">Essai : animations Quaternius (CC0) sur nos figurines. Glisser pour tourner, molette ou pincer pour zoomer.<br><span id="phase"></span></div>
<script type="module">
// Page d'essai des animations précalculées (dev/cuire.mjs) : chaque os de la figurine suit la matrice de son os dans la
// texture des animations (gestes du fusil compris).
//   anims.html?t=9.5 : arrête l'horloge à 9,5 s ; cat=0 : sans le catalogue ; window.__at(t) dessine l'instant t
//   (captures image par image)
import * as THREE from '../../../vendor/three/three.module.js';
import { model } from '../troupes.js';
import { hash } from '../formes.js';

const q = new URLSearchParams(location.search);
const meta = await fetch('../../../anims/soldat.json').then(r => r.json());
const half = new Uint16Array(await fetch('../../../anims/soldat.bin').then(r => r.arrayBuffer()));
const NB = meta.bones.length, B = Object.fromEntries(meta.bones.map((b, i) => [b, i]));
const tex = new THREE.DataTexture(half, NB * 3, meta.rows, THREE.RGBAFormat, THREE.HalfFloatType);
tex.needsUpdate = true;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NeutralToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#bcd0dc'); scene.fog = new THREE.Fog('#bcd0dc', 60, 160);
scene.add(new THREE.HemisphereLight('#dfe8f0', '#5d5a3c', 1.4));
const sun = new THREE.DirectionalLight('#fff3dc', 2.2); sun.position.set(-30, 50, -20); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: '#7f9150' }));
scene.add(ground);

// ------------------------------------------------------------------ matériau des figurines animées
const uni = { uAnim: { value: tex }, uTime: { value: 0 }, uFps: { value: meta.fps } };
const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
mat.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, uni);
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', `#include <common>
      attribute vec4 iPos;    // x, z, cap, taille
      attribute vec4 iClip;   // première ligne, images, en boucle, début
      attribute vec4 iMisc;   // vitesse
      attribute vec3 iCoat;
      attribute float aBone, aPart;
      uniform sampler2D uAnim; uniform float uTime, uFps;
      vec4 R(int b, int f, int k) { return texelFetch(uAnim, ivec2(b * 3 + k, f), 0); }`)
    .replace('#include <beginnormal_vertex>', `#include <beginnormal_vertex>
      float n = iClip.y, fr = max(uTime - iClip.w, 0.0) * iMisc.x * uFps;
      fr = iClip.z > 0.5 ? mod(fr, n) : min(fr, n - 1.0);
      int f0 = int(iClip.x) + int(fr), f1 = int(iClip.x) + int(iClip.z > 0.5 ? mod(fr + 1.0, n) : min(fr + 1.0, n - 1.0));
      int b = int(aBone + 0.5);
      float ff = fract(fr);
      vec4 r0 = mix(R(b, f0, 0), R(b, f1, 0), ff), r1 = mix(R(b, f0, 1), R(b, f1, 1), ff), r2 = mix(R(b, f0, 2), R(b, f1, 2), ff);
      float sa = sin(iPos.z), ca = cos(iPos.z);
      objectNormal = vec3(dot(r0.xyz, objectNormal), dot(r1.xyz, objectNormal), dot(r2.xyz, objectNormal));
      objectNormal = vec3(objectNormal.x * ca + objectNormal.z * sa, objectNormal.y, -objectNormal.x * sa + objectNormal.z * ca);`)
    .replace('#include <begin_vertex>', `vec3 transformed = position;
      transformed = vec3(dot(r0, vec4(transformed, 1.0)), dot(r1, vec4(transformed, 1.0)), dot(r2, vec4(transformed, 1.0))) * iPos.w;
      transformed = vec3(transformed.x * ca + transformed.z * sa, transformed.y, -transformed.x * sa + transformed.z * ca) + vec3(iPos.x, 0.0, iPos.y);`)
    .replace('#include <color_vertex>', '#include <color_vertex>\nvColor.rgb = mix(vColor.rgb, iCoat * color.r, aPart);');
};
mat.customProgramCacheKey = () => 'anims-essai';

// un lot de figurines d'une sorte ; set(i, …) range la figurine i
function batch(kind, n) {
  const g = model(kind, 1780, 1, true), A = {};
  for (const [k, w] of [['iPos', 4], ['iClip', 4], ['iMisc', 4], ['iCoat', 3]]) g.setAttribute(k, A[k] = new THREE.InstancedBufferAttribute(new Float32Array(n * w), w).setUsage(THREE.DynamicDrawUsage));
  const mesh = new THREE.InstancedMesh(g, mat, n);
  mesh.frustumCulled = false; scene.add(mesh);
  const coat = new THREE.Color();
  return {
    set(i, x, z, cap, clip, t0, { speed = 1, size = 1, color = '#b0362c' } = {}) {
      const c = meta.clips[clip];
      A.iPos.setXYZW(i, x, z, cap, size); A.iClip.setXYZW(i, c.row, c.n, c.loop, t0); A.iMisc.setXYZW(i, speed, 0, 0, 0);
      coat.set(color); A.iCoat.setXYZ(i, coat.r, coat.g, coat.b);
    },
    done() { for (const a of Object.values(A)) a.needsUpdate = true; },
  };
}
const dur = c => meta.clips[c].n / meta.fps;

// ------------------------------------------------------------------ le catalogue : une animation par figurine
// [étiquette, sorte, animation] ; les animations sans boucle sont rejouées
const CAT = [['Repos', 'inf', 'repos'], ['Parle', 'officier', 'parle'], ['Marche au pas', 'inf', 'marche'], ['Pas', 'inf', 'pas'],
  ['Trot', 'inf', 'trot'], ['Charge', 'inf', 'charge'], ['En joue', 'inf', 'joue'], ['À genoux, en joue', 'inf', 'genou'],
  ['Recharge', 'inf', 'recharge'], ['Poussée', 'inf', 'poussee'], ['Estoc', 'inf', 'estoc'], ['Touché', 'inf', 'touche'],
  ['Projeté', 'inf', 'projete'], ['Mort', 'inf', 'mort'], ['Sabre', 'officier', 'sabre'], ['Assaut', 'officier', 'combo']];
if (q.get('cat') === '0') CAT.length = 0;
const cat = { inf: batch('inf', Math.max(1, CAT.length)), officier: batch('officier', Math.max(1, CAT.length)) };
const labels = CAT.map(([l], i) => {
  const d = document.createElement('div'); d.className = 'lab'; d.textContent = l; document.body.appendChild(d);
  return { d, p: new THREE.Vector3((i - (CAT.length - 1) / 2) * 2.4, 2.3, 0) };
});
function catalogue(t) {
  for (const k of Object.values(cat)) for (let i = 0; i < CAT.length; i++) k.set(i, 0, -999, 0, 'repos', 0);
  CAT.forEach(([, kind, clip], i) => {
    const loop = meta.clips[clip].loop, p = dur(clip) + 1.2;
    cat[kind].set(i, labels[i].p.x, 0, Math.PI, clip, loop ? 0 : Math.floor(t / p) * p);
  });
  for (const k of Object.values(cat)) k.done();
}

// ------------------------------------------------------------------ la compagnie : marche, halte, en joue, salve
// reçue (des hommes tombent et restent au sol), recharge, charge ; une boucle de 18 s, calculée à partir de t seul
const RANKS = 3, FILES = 20, SP = 0.78, SR = 1.15, Z0 = 24, VM = 1.15, VC = 4.2;
const co = batch('inf', RANKS * FILES);
const zAt = t => Z0 - VM * Math.min(t, 6) - (t > 13 ? VC * (t - 13) : 0);   // le front avance vers la caméra (−z)
function company(T) {
  const t = T % 18;
  for (let r = 0; r < RANKS; r++) for (let k = 0; k < FILES; k++) {
    const i = r * FILES + k, h = hash(i, 7, 3), x = (k - (FILES - 1) / 2) * SP + (r & 1) * SP / 2 + (hash(i, 2, 5) - 0.5) * 0.1;
    const dz = r * SR + (hash(i, 4, 5) - 0.5) * 0.1, ph = (hash(i, 9, 1) - 0.5) * 0.08;
    const tDie = h < 0.14 ? 9.4 + hash(i, 11, 2) * 2.5 : 99, tHit = h > 0.9 ? 9.6 + hash(i, 12, 2) * 2 : 99;
    let clip = 'repos', t0 = ph;
    if (t >= tDie) { clip = 'mort'; t0 = tDie; }
    else if (t < 6) clip = 'marche';
    else if (t >= 13) clip = 'charge';
    else if (t >= tHit && t < tHit + dur('touche')) { clip = 'touche'; t0 = tHit; }
    else if (t >= 7.2 && t < 9.3 && r < 2) clip = r === 0 ? 'genou' : 'joue';
    else if (t >= 9.3 && t < 13 && r < 2) { clip = 'recharge'; t0 = 9.3 + ph * 4; }
    co.set(i, x, zAt(Math.min(t, tDie)) + dz, Math.PI, clip, t0 + T - t, { size: 1.1 });
  }
  co.done();
  document.getElementById('phase').textContent = t < 6 ? 'Marche au pas' : t < 7.2 ? 'Halte' : t < 9.3 ? 'En joue (1er rang à genoux)' : t < 13 ? 'Salve reçue : des hommes tombent ; on recharge' : 'Charge à la baïonnette';
}

// ------------------------------------------------------------------ caméra (glisser : tourner ; molette, pincer : zoom)
const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 400);
const cam = { yaw: 0.35, pitch: 0.42, dist: 34, target: new THREE.Vector3(0, 0.8, 8) };
const ptrs = new Map();
let pinch0 = 0;
addEventListener('pointerdown', e => ptrs.set(e.pointerId, e));
addEventListener('pointerup', e => { ptrs.delete(e.pointerId); pinch0 = 0; });
addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  if (ptrs.size === 1) { cam.yaw -= (e.clientX - p.clientX) * 0.005; cam.pitch = THREE.MathUtils.clamp(cam.pitch + (e.clientY - p.clientY) * 0.004, 0.08, 1.4); }
  ptrs.set(e.pointerId, e);
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (pinch0) cam.dist = THREE.MathUtils.clamp(cam.dist * pinch0 / d, 4, 120);
    pinch0 = d;
  }
});
addEventListener('wheel', e => { cam.dist = THREE.MathUtils.clamp(cam.dist * Math.exp(e.deltaY * 0.001), 4, 120); }, { passive: true });

function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const v = new THREE.Vector3();
function draw(t) {
  uni.uTime.value = t;
  catalogue(t); company(t);
  camera.position.set(cam.target.x - Math.sin(cam.yaw) * Math.cos(cam.pitch) * cam.dist, cam.target.y + Math.sin(cam.pitch) * cam.dist, cam.target.z - Math.cos(cam.yaw) * Math.cos(cam.pitch) * cam.dist);
  camera.lookAt(cam.target);
  renderer.render(scene, camera);
  for (const { d, p } of labels) {
    v.copy(p).project(camera);
    d.style.display = v.z < 1 ? '' : 'none';
    d.style.left = `${(v.x + 1) / 2 * innerWidth}px`; d.style.top = `${(1 - v.y) / 2 * innerHeight}px`;
  }
}
const frozen = q.has('t') ? +q.get('t') : null;
window.__cam = cam;
window.__at = t => { window.__frozen = t; draw(t); };
renderer.setAnimationLoop(() => draw(window.__frozen ?? frozen ?? performance.now() / 1000));
document.title = 'pret';
</script>
</body>
</html>
