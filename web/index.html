<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#13233a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Conquête">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Conquête : Aquitaine 1700-1899</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="map" role="img" aria-label="Carte de l'Aquitaine"></canvas>
  <canvas id="fog" aria-hidden="true"></canvas>

  <header id="topbar" hidden>
    <div class="tb-faction" id="tb-faction"></div>
    <div class="tb-date">
      <div class="tb-day" id="tb-day"></div>
      <div class="tb-season" id="tb-season"></div>
    </div>
    <div class="tb-speed" id="tb-speed" role="group" aria-label="Vitesse du temps"></div>
    <div class="tb-turn" id="tb-turn" role="group" aria-label="Tour de jeu" hidden></div>
    <div class="tb-res" id="tb-res"></div>
    <button class="tb-menu icon-btn" id="btn-menu" aria-label="Menu de la partie"></button>
  </header>

  <nav id="rail" hidden></nav>
  <section id="panel" class="sheet" hidden></section>
  <div id="feed" hidden></div>
  <section id="recap" class="sheet" aria-label="Récapitulatif du mois" hidden></section>
  <div id="zoombar" hidden>
    <button class="zb" data-act="zoom" data-v="in" aria-label="Zoom avant">+</button>
    <button class="zb" data-act="zoom" data-v="out" aria-label="Zoom arrière">−</button>
    <button class="zb" data-act="zoom" data-v="home" aria-label="Centrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg></button>
    <button class="zb" id="zb-fog" data-act="fog" aria-label="Brouillard de guerre" title="Brouillard de guerre">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/></svg></button>
  </div>
  <div id="proposals"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="bubble" hidden></div>
  <div id="tooltip" hidden></div>
  <div id="modal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="m-title"></div></div>
  <div id="start" hidden></div>
  <div id="loading"><div class="loading-card"><div class="loading-title">Conquête</div><div id="loading-text">Gravure de la carte…</div></div></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
