[package]
name = "conquete"
version = "0.1.0"
edition = "2021"
description = "Conquête : le moteur du jeu et son serveur — le portage de server.py et de game/"

[lib]
doctest = false # les schémas indentés des commentaires ne sont pas du code

[dependencies]
indexmap = "2"   # les dict de Python : l'ordre d'insertion est gardé
# float_roundtrip : un flottant relu est, au bit près, celui qui a été écrit (sans cela, serde_json se trompe parfois du dernier bit)
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"    # random.Random("texte") : la graine passe par SHA-512, comme en Python
sha1 = "0.10"    # rules.py : le profil et le caractère des départements générés viennent d'un SHA-1 de leur code
# Serveur HTTP/HTTPS et appairage : communs aux web tools (dépôt web_suite), à la place de http.server et d'appairage.py
web_tools_commun = { git = "https://github.com/pilou33620/web_suite", rev = "8adfcd95d71e13d913087676c723dc1327fc17c1" }
flate2 = "1"     # gzip.compress de server.py (/api/map, /api/state)
chrono = { version = "0.4", default-features = false, features = ["clock"] } # time.strftime : le nom d'une sauvegarde mise de côté (déjà tiré par la caisse commune)
